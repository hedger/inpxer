name: docker-cache

# Warms the BuildKit cache that the release workflow consumes. GitHub only lets
# a workflow read cache written by its own ref, its base branch or the default
# branch, so without a default-branch build every tag build starts cold.

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
      - '.github/workflows/docker-cache.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  warm:
    name: Warm Docker build cache
    runs-on: ubuntu-latest
    steps:
      -
        name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64,arm64
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha,scope=inpxer
          cache-to: type=gha,mode=max,scope=inpxer
          platforms: linux/amd64,linux/arm64
